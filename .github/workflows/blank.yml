name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deterministic-audio-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile OH-M04 reference implementation
        run: python -m py_compile packages/audio-analysis/python/sonic_measurement.py

      - name: Run OH-M04 deterministic measurement tests
        working-directory: packages/audio-analysis/python
        run: python -m unittest -v test_sonic_measurement.py

      - name: Validate measurement schema JSON
        run: python -m json.tool docs/knowledge/schemas/audio-measurement-profile.schema.json > /dev/null
