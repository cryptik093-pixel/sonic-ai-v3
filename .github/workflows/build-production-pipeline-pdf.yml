name: Build Omega House Production Pipeline PDF

on:
  push:
    paths:
      - 'docs/production/OMEGA_HOUSE_CORE_PRODUCTION_ASSET_PIPELINE_V1.0.md'
      - 'tools/docs/build_production_pipeline_pdf.py'
      - '.github/workflows/build-production-pipeline-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip markdown weasyprint

      - name: Build technical PDF
        run: python tools/docs/build_production_pipeline_pdf.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/production/OMEGA_HOUSE_CORE_PRODUCTION_ASSET_PIPELINE_V1.0_Technical_Edition.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "docs: generate Omega House production pipeline PDF"
          git push
