name: Sonic desktop

on:
  push:
    branches: [main, "codex/sonic-production-workbench"]
    paths: ["apps/api/**", "apps/desktop/**", "scripts/build-desktop.py", "scripts/verify-workbench-browser.py", ".github/workflows/sonic-desktop.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/api/**", "apps/desktop/**", "scripts/build-desktop.py", "scripts/verify-workbench-browser.py", ".github/workflows/sonic-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonic-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/desktop/requirements-test.txt
      - run: python -m pytest apps/api/tests -q
      - run: python apps/desktop/launcher.py --smoke-test desktop-smoke.json
      - run: python -m playwright install --with-deps chromium
      - name: Verify browser workflow
        env:
          SONIC_SCREENSHOT_DIR: test-results/screenshots
        run: python scripts/verify-workbench-browser.py > browser-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonic-linux-verification
          path: |
            desktop-smoke.json
            browser-proof.json
            test-results/screenshots

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        run: python -m pip install -r apps/desktop/requirements.txt
      - name: Test Windows runtime
        run: python -m pytest apps/api/tests -q
      - name: Package native app
        run: python scripts/build-desktop.py
      - name: Verify packaged app
        shell: pwsh
        run: |
          $sonicProcess = Start-Process -FilePath "dist/Sonic/Sonic.exe" -ArgumentList "--smoke-test", "packaged-smoke.json" -PassThru
          if (!$sonicProcess.WaitForExit(120000)) { Stop-Process -Id $sonicProcess.Id; throw "Packaged app timed out" }
          if (Test-Path packaged-smoke.json) { Get-Content packaged-smoke.json }
          if ($sonicProcess.ExitCode -ne 0) { throw "Packaged app failed" }
          if (!(Test-Path packaged-smoke.json)) { throw "Packaged app did not produce verification evidence" }
          $sonicProof = Get-Content packaged-smoke.json | ConvertFrom-Json
          if (!$sonicProof.passed) { throw "Packaged smoke did not pass" }
      - name: Verify native window and generation
        shell: pwsh
        run: |
          $sonicProcess = Start-Process -FilePath "dist/Sonic/Sonic.exe" -ArgumentList "--ui-smoke-test", "native-ui-smoke.json" -PassThru
          if (!$sonicProcess.WaitForExit(120000)) { Stop-Process -Id $sonicProcess.Id; throw "Native UI timed out" }
          if ($sonicProcess.ExitCode -ne 0) { throw "Native UI failed" }
          if (!(Test-Path native-ui-smoke.json)) { throw "Native UI evidence missing" }
          $sonicProof = Get-Content native-ui-smoke.json | ConvertFrom-Json
          if (!$sonicProof.passed) { throw "Native UI did not pass" }
      - name: Include quick start
        run: Copy-Item apps/desktop/QUICK_START.txt dist/Sonic/START_HERE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sonic-Windows-x64
          path: dist/Sonic/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonic-windows-verification
          path: |
            packaged-smoke.json
            native-ui-smoke.json
          if-no-files-found: warn
