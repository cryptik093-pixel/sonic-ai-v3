name: Veracode Static Analysis Pipeline Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "34 22 * * 4"

permissions:
  contents: read

jobs:
  build-and-pipeline-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    env:
      VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
      VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine whether Veracode is configured
        id: veracode
        shell: bash
        run: |
          if [[ -n "$VERACODE_API_ID" && -n "$VERACODE_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Veracode credentials are configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Veracode credentials are not configured; skipping external scan."
          fi

      - name: Build bounded scan target
        if: steps.veracode.outputs.enabled == 'true'
        shell: bash
        run: |
          zip -r veracode-scan-target.zip \
            apps \
            packages \
            infrastructure \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            -x "*.db" "*.log" ".env" ".env.*" "*/node_modules/*" "*/.venv/*" "*/__pycache__/*"

      - name: Download Veracode Pipeline Scan
        if: steps.veracode.outputs.enabled == 'true'
        run: curl --silent --show-error --fail -O https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip

      - name: Extract Veracode Pipeline Scan
        if: steps.veracode.outputs.enabled == 'true'
        run: unzip -o pipeline-scan-LATEST.zip

      - name: Set up Java
        if: steps.veracode.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: temurin

      - name: Run Veracode Pipeline Scan
        if: steps.veracode.outputs.enabled == 'true'
        id: scan
        run: >-
          java -jar pipeline-scan.jar
          --veracode_api_id "$VERACODE_API_ID"
          --veracode_api_key "$VERACODE_API_KEY"
          --fail_on_severity="Very High, High"
          --file veracode-scan-target.zip
        continue-on-error: true

      - name: Detect scan results
        if: steps.veracode.outputs.enabled == 'true'
        id: results
        shell: bash
        run: |
          if [[ -f results.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No results.json was produced; SARIF conversion will be skipped."
          fi

      - name: Convert pipeline scan output to SARIF
        if: steps.veracode.outputs.enabled == 'true' && steps.results.outputs.available == 'true'
        id: convert
        uses: veracode/veracode-pipeline-scan-results-to-sarif@ff08ae5b45d5384cb4679932f184c013d34da9be
        with:
          pipeline-results-json: results.json

      - name: Upload SARIF
        if: steps.veracode.outputs.enabled == 'true' && steps.results.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veracode-results.sarif
