name: Tier 2 intelligence loop

on:
  push:
    branches:
      - "tier2/intelligence-loop-init-2026-10-05"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/intelligence/**"
      - "packages/memory/intelligence-checkpoint.ts"
      - "packages/events/durable-store.ts"
      - "packages/events/checkpoint-publisher.ts"
      - "docs/recovery/TIER2_INITIATION_2026-10-05.md"
      - ".github/workflows/tier2-intelligence-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evolution and durable-loop tests
        run: pnpm exec vitest run packages/intelligence/src/evolution.test.ts packages/intelligence/src/evolution.integration.test.ts

  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate Tier 2 schemas and fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("packages/intelligence")
          schemas = {}
          for path in sorted((root / "schemas").glob("*.schema.json")):
              data = json.loads(path.read_text())
              Draft202012Validator.check_schema(data)
              schemas[path.name] = data

          fixture = json.loads((root / "fixtures" / "future-intent-001.json").read_text())
          Draft202012Validator(
              schemas["future-intent.schema.json"],
              format_checker=Draft202012Validator.FORMAT_CHECKER,
          ).validate(fixture)

          event = {
              "event_id": "EV-001",
              "intent_id": "SI-OH-LEGACY-001",
              "event_type": "obstacle",
              "occurred_at": "2026-09-01T01:00:00Z",
              "source": "creator",
              "obstacle": {
                  "obstacle_id": "OBS-001",
                  "type": "operational",
                  "severity": "high",
                  "status": "open"
              }
          }
          Draft202012Validator(
              schemas["evolution-loop.schema.json"],
              format_checker=Draft202012Validator.FORMAT_CHECKER,
          ).validate(event)
          print(f"PASS: {len(schemas)} Tier-2 schemas + fixture + stable-obstacle event")
          PY
