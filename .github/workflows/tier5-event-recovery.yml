name: Tier 5 event recovery validation

on:
  push:
    branches:
      - "recovery/tier1-tier5-event-contract-2026-10-05"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/events/**"
      - "apps/api/event_store.py"
      - "apps/api/test_event_store.py"
      - ".github/workflows/tier5-event-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate TypeScript event contract
        run: pnpm --filter @sonic-ai/events test

  durable-store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate durable idempotent event store
        run: python -m pytest apps/api/test_event_store.py -q
