name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deterministic-audio-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Phase 2 audio intelligence modules
        run: |
          python -m py_compile packages/audio-analysis/python/sonic_measurement.py
          python -m py_compile packages/audio-analysis/python/defect_taxonomy.py
          python -m py_compile packages/audio-analysis/python/metadata_envelope.py

      - name: Run OH-M04 measurement tests
        working-directory: packages/audio-analysis/python
        run: python -m unittest -v test_sonic_measurement.py

      - name: Run OH-M02 taxonomy tests
        working-directory: packages/audio-analysis/python
        run: python -m unittest -v test_defect_taxonomy.py

      - name: Run OH-M05 metadata envelope tests
        working-directory: packages/audio-analysis/python
        run: python -m unittest -v test_metadata_envelope.py

      - name: Validate Phase 2 contract schemas
        run: |
          python -m json.tool docs/knowledge/schemas/audio-measurement-profile.schema.json > /dev/null
          python -m json.tool docs/knowledge/schemas/audio-defect-record.schema.json > /dev/null
          python -m json.tool docs/knowledge/schemas/asset-intelligence-envelope.schema.json > /dev/null
