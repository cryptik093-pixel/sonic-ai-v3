name: Sonic V3.2 integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "upgrade/sonic-v3.2-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonic-v32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Verify canonical and legacy modules in disposable storage
        run: python scripts/verify_v32.py --output artifacts/v3.2/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonic-v32-${{ matrix.os }}
          path: artifacts/v3.2/
          if-no-files-found: error
